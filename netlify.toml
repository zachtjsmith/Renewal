[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every route serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# jobs.json changes nightly — never let a CDN serve a stale board
[[headers]]
  for = "/jobs.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
